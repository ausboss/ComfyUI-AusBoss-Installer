name: Image
# Builds the RunPod image (runpod/Dockerfile) for CUDA 12.8 and CUDA 13.0.
# Pull requests only build and smoke-test it. Push a tag like image-v1.0.0 to
# publish ghcr.io/ausboss/comfyui-ausboss:<version>-cuda12.8 and -cuda13.0, and
# move the cuda12.8, cuda13.0 and latest tags. A tag with a dash
# (image-v1.1.0-rc.1) publishes only its own version tags.
on:
  push:
    tags: ["image-v*"]
  pull_request:
    paths: ["runpod/**", "nodes.txt", ".dockerignore", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/ausboss/comfyui-ausboss
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["cuda12.8", "cuda13.0"]
    steps:
      - name: Make room for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f runpod/Dockerfile --build-arg CUDA=${{ matrix.cuda }} -t image:test .
      - name: Smoke test
        run: |
          docker run --rm --entrypoint cat image:test /opt/ausboss/versions.txt
          # Load every node pack on the CPU and stop: fails on an import error.
          docker run --rm --entrypoint bash image:test -c '
            mkdir -p /tmp/ws/custom_nodes && cd /opt/comfyui-baked &&
            python3 main.py --cpu --quick-test-for-ci --base-directory /tmp/ws \
              --extra-model-paths-config /opt/ausboss/extra_model_paths.yaml 2>&1 | tee /tmp/log
            ! grep -q "IMPORT FAILED" /tmp/log && grep -q "ausboss-nodes" /tmp/log'
          # The token gate answers 401 without the token and 200 with it.
          mkdir -p ws/ausboss && echo "--cpu" > ws/ausboss/comfyui_args.txt
          docker run -d --name smoke -p 8188:8188 -v "$PWD/ws:/workspace" -e COMFYUI_TOKEN=smoke-test-token-123456 image:test
          for i in $(seq 60); do curl -sf -o /dev/null -H "Authorization: Bearer smoke-test-token-123456" localhost:8188/system_stats && break; sleep 3; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8188/system_stats)" = 401
          curl -sf -H "Authorization: Bearer smoke-test-token-123456" localhost:8188/system_stats
          docker rm -f smoke
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME#image-v}"; else version="dev-${GITHUB_SHA::7}"; fi
          tags=("$IMAGE:$version-${{ matrix.cuda }}")
          if [ "${{ github.ref_type }}" = tag ] && [[ "$version" != *-* ]]; then
            tags+=("$IMAGE:${{ matrix.cuda }}")
            [ "${{ matrix.cuda }}" = cuda12.8 ] && tags+=("$IMAGE:latest")
          fi
          for t in "${tags[@]}"; do docker tag image:test "$t" && docker push "$t"; done
